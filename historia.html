<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LW. Studios — Historia</title>
<link rel="icon" href="FAVICON2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --gold: #b8bec8;
  --gold-bright: #dde3ec;
  --gold-deep: #6e7580;
  --white: #f5f3ee;
  --silver: #d1d1d1;
  --smoke: #7a7a7a;
  --black: #080808;
  --surface: #0f0e0a;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.18);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Cormorant Garamond',serif;min-height:100vh;overflow-x:hidden;}
@media(hover:hover) and (pointer:fine){*,*::before,*::after{cursor:none!important;}}

/* NOISE */
body::after{content:'';position:fixed;inset:0;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;}

/* CURSOR */
.cursor{position:fixed;width:6px;height:6px;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);display:none;}
.cursor-ring{display:none!important;}

@media(hover:hover) and (pointer:fine){.cursor,.cursor-ring{display:none!important;}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:0 72px;height:72px;transition:0.5s;}
nav.scrolled{background:rgba(8,8,8,0.94);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.12em;color:var(--white);text-decoration:none;}
.nav-logo span{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.55);}
.nav-right{display:flex;align-items:center;gap:20px;}
.nav-back{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--smoke);text-decoration:none;transition:0.3s;display:flex;align-items:center;gap:10px;}
.nav-back::before{content:'←';font-size:0.7rem;transition:transform 0.3s;}
.nav-back:hover{color:rgba(255,255,255,0.85);}
.nav-back:hover::before{transform:translateX(-4px);}

/* AUTH EN NAV */
#nav-auth-btn{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.38);background:transparent;border:1px solid rgba(197,160,89,0.18);padding:7px 14px;cursor:pointer;transition:0.3s;}
#nav-auth-btn:hover{color:rgba(255,255,255,0.85);border-color:rgba(255,255,255,0.28);}
#nav-user-menu{display:none;align-items:center;gap:8px;}
#nav-user-menu.visible{display:flex;}
.nav-avatar{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:0.8rem;color:rgba(255,255,255,0.85);overflow:hidden;flex-shrink:0;transition:border-color 0.3s;}
#nav-user-menu a:hover .nav-avatar{border-color:rgba(255,255,255,0.35);}
#nav-user-menu a:hover .nav-user-name{color:rgba(255,255,255,0.85);}
.nav-avatar img{width:100%;height:100%;object-fit:cover;}
.nav-user-name{font-family:'DM Mono',monospace;font-size:0.38rem;letter-spacing:0.13em;color:rgba(255,255,255,0.30);text-transform:uppercase;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#nav-logout-btn{font-family:'DM Mono',monospace;font-size:0.35rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(122,122,122,0.5);background:transparent;border:none;cursor:pointer;transition:0.3s;}
#nav-logout-btn:hover{color:rgba(255,255,255,0.85);}

/* HERO COVER */
.story-hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:flex-end;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.05);transition:transform 8s ease-out;}
.hero-bg.loaded{transform:scale(1);}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,8,8,0.2) 0%,rgba(8,8,8,0.1) 30%,rgba(8,8,8,0.7) 70%,rgba(8,8,8,1) 100%);}
.hero-overlay-side{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,8,0.6) 0%,transparent 50%);}
.hero-content{position:relative;z-index:10;padding:0 72px 80px;width:100%;max-width:900px;overflow-wrap:break-word;word-break:break-word;}
.hero-eyebrow{display:flex;align-items:center;gap:14px;font-family:'DM Mono',monospace;font-size:0.48rem;color:rgba(255,255,255,0.85);letter-spacing:0.35em;text-transform:uppercase;margin-bottom:24px;opacity:0;animation:fadeUp 1s 0.3s both;}
.hero-eyebrow::before{content:'';display:block;width:28px;height:1px;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);}
.story-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.5rem,8vw,6.5rem);line-height:0.9;letter-spacing:0.02em;color:var(--white);margin-bottom:20px;opacity:0;animation:fadeUp 1.1s 0.45s both;word-break:break-word;}
.story-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,2.5vw,1.5rem);color:var(--silver);line-height:1.5;max-width:560px;opacity:0;animation:fadeUp 1s 0.6s both;}
.hero-meta{display:flex;align-items:center;gap:32px;margin-top:36px;padding-top:28px;border-top:1px solid var(--border);opacity:0;animation:fadeUp 1s 0.75s both;}
.meta-item{display:flex;flex-direction:column;gap:5px;}
.meta-label{font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(255,255,255,0.30);letter-spacing:0.3em;text-transform:uppercase;}
.meta-value{font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--silver);letter-spacing:0.15em;}
.meta-sep{width:1px;height:36px;background:var(--border);}
.hero-scroll-hint{display:none;}


/* NO COVER */
.story-hero.no-cover{height:auto;min-height:0;padding-top:120px;}
.story-hero.no-cover .hero-bg{display:none;}
.story-hero.no-cover .hero-overlay,.story-hero.no-cover .hero-overlay-side{display:none;}
.story-hero.no-cover .hero-content{padding:80px 72px 60px;max-width:100%;}
.story-hero.no-cover .story-title{font-size:clamp(3rem,8vw,6rem);}

/* TAGS */
.tags-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;opacity:0;animation:fadeUp 1s 0.85s both;}
.tag{font-family:'DM Mono',monospace;font-size:0.34rem;letter-spacing:0.2em;text-transform:uppercase;padding:4px 12px;border:1px solid var(--border-strong);color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.04);}

/* ARTICLE */
.article-wrap{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:80px 40px 120px;overflow-wrap:break-word;word-break:break-word;}

/* READING PROGRESS */
.progress-bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);z-index:9999;width:0%;transition:width 0.1s linear;box-shadow:0 0 8px rgba(255,255,255,0.25);}

/* CONTENT BLOCKS */
.block-p{font-family:'Cormorant Garamond',serif;font-size:1.2rem;line-height:1.95;color:var(--silver);margin-bottom:28px;font-weight:300;word-break:break-word;overflow-wrap:break-word;hyphens:auto;}
.block-p:first-child::first-letter{font-size:4rem;font-weight:600;line-height:0.75;float:left;margin:8px 14px 0 0;color:rgba(255,255,255,0.85);font-style:normal;}
.block-h{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:0.04em;color:var(--white);margin:56px 0 18px;line-height:1;word-break:break-word;}
.block-q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.35rem;line-height:1.65;color:rgba(255,255,255,0.85);border-left:2px solid rgba(255,255,255,0.25);padding:8px 0 8px 28px;margin:44px 0;position:relative;word-break:break-word;}
.block-q::before{content:'"';position:absolute;top:-20px;left:20px;font-size:5rem;color:rgba(255,255,255,0.07);line-height:1;font-style:normal;}
.block-pq{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.6rem;line-height:1.5;color:var(--white);text-align:center;padding:32px 0;margin:44px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.block-cap{font-family:'DM Mono',monospace;font-size:0.42rem;color:var(--smoke);letter-spacing:0.15em;text-align:center;margin:-8px 0 24px;line-height:1.7;word-break:break-word;}
.block-hr{border:none;border-top:1px solid var(--border);margin:52px 0;position:relative;}
.block-hr::after{content:'◈';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--black);color:rgba(255,255,255,0.85);font-size:0.6rem;padding:0 16px;}
.block-img{width:100%;max-height:600px;object-fit:cover;display:block;margin:36px 0;border:1px solid var(--border);cursor:zoom-in;}
.block-img-full{width:calc(100% + 80px);margin-left:-40px;max-height:680px;object-fit:cover;display:block;margin-top:44px;margin-bottom:44px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:zoom-in;}
.block-video{position:relative;padding-bottom:56.25%;height:0;margin:44px 0;overflow:hidden;border:1px solid var(--border);}
.block-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.block-cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:32px 0;}
.block-link{display:inline-block;font-family:'DM Mono',monospace;font-size:0.5rem;color:rgba(255,255,255,0.85);letter-spacing:0.15em;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.18);padding-bottom:2px;margin:12px 0;transition:border-color 0.3s;}
.block-link:hover{border-color:rgba(255,255,255,0.35);}

/* GALLERY */
.gallery-section{position:relative;z-index:10;padding:0 0 80px;max-width:1200px;margin:0 auto;}
.gallery-title{font-family:'DM Mono',monospace;font-size:0.42rem;color:rgba(255,255,255,0.25);letter-spacing:0.35em;text-transform:uppercase;padding:0 40px 24px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 0;}
.gallery-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.gallery-grid.cols-1{grid-template-columns:1fr;max-width:720px;margin:0 auto;}
.gallery-item{aspect-ratio:4/3;overflow:hidden;position:relative;cursor:zoom-in;}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s cubic-bezier(.16,1,.3,1);}
.gallery-item:hover img{transform:scale(1.04);}
.gallery-item:first-child:nth-last-child(1){aspect-ratio:16/7;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.96);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.lightbox.open{opacity:1;pointer-events:auto;}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border:1px solid var(--border);}
.lightbox-close{position:absolute;top:32px;right:40px;font-family:'DM Mono',monospace;font-size:0.5rem;color:var(--smoke);letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:color 0.2s;}
.lightbox-close:hover{color:var(--white);}

/* END SECTION */
.story-end{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:0 40px 80px;}
.end-rule{display:flex;align-items:center;gap:24px;margin-bottom:48px;}
.end-rule::before,.end-rule::after{content:'';flex:1;height:1px;background:var(--border);}
.end-mark{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:rgba(255,255,255,0.85);letter-spacing:0.2em;}
.end-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--white);margin-bottom:12px;letter-spacing:0.04em;}
.end-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--smoke);margin-bottom:36px;line-height:1.6;}
.end-actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn-back{padding:14px 36px;border:1px solid var(--border-strong);font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--white);text-decoration:none;transition:0.3s;}
.btn-back:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.85);}
.btn-share{padding:14px 36px;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);border:1px solid var(--gold);font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--black);cursor:pointer;transition:0.3s;}
.btn-share:hover{background:var(--gold-bright);border-color:var(--gold-bright);}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:48px 72px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--white);text-decoration:none;letter-spacing:0.12em;}
.footer-logo span{color:rgba(255,255,255,0.85);}
.footer-copy{font-family:'DM Mono',monospace;font-size:0.38rem;color:var(--smoke);letter-spacing:0.2em;text-transform:uppercase;}

/* LOADING / ERROR */
.state-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;}
.state-icon{font-size:3rem;opacity:0.3;}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--smoke);letter-spacing:0.04em;}
.state-sub{font-family:'DM Mono',monospace;font-size:0.44rem;color:rgba(122,122,122,0.5);letter-spacing:0.2em;text-transform:uppercase;}
.loader-ring{width:40px;height:40px;border:2px solid var(--border);border-top-color:rgba(255,255,255,0.85);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px);}to{opacity:1;transform:translateY(0);}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.9s cubic-bezier(.16,1,.3,1),transform 0.9s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--black);}
::-webkit-scrollbar-thumb{background:var(--border-strong);}

/* ════════════════════════════════════
   AUTH MODAL
════════════════════════════════════ */
#auth-modal{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.45s cubic-bezier(.4,0,.2,1);}
#auth-modal.open{opacity:1;pointer-events:auto;}
#auth-backdrop{position:absolute;inset:0;background:rgba(5,5,4,0.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
#auth-card{position:relative;z-index:1;background:linear-gradient(150deg,#15130e 0%,#080808 60%,#060504 100%);border:1px solid rgba(255,255,255,0.15);width:92vw;max-width:440px;padding:52px 48px 48px;transform:scale(0.9) translateY(30px);transition:transform 0.5s cubic-bezier(.16,1,.3,1),opacity 0.4s;opacity:0;}
#auth-modal.open #auth-card{transform:scale(1) translateY(0);opacity:1;}
.auth-corner{position:absolute;width:12px;height:12px;border-color:rgba(255,255,255,0.28);border-style:solid;}
.auth-corner.tl{top:10px;left:10px;border-width:1px 0 0 1px;}
.auth-corner.tr{top:10px;right:10px;border-width:1px 1px 0 0;}
.auth-corner.bl{bottom:10px;left:10px;border-width:0 0 1px 1px;}
.auth-corner.br{bottom:10px;right:10px;border-width:0 1px 1px 0;}
#auth-close{position:absolute;top:16px;right:18px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.30);width:32px;height:32px;font-size:0.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s;font-family:'DM Mono',monospace;}
#auth-close:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.30);color:rgba(255,255,255,0.85);}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:0.15em;color:var(--white);margin-bottom:4px;}
.auth-logo span{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.55);}
.auth-tabs{display:flex;margin:28px 0;border-bottom:1px solid rgba(255,255,255,0.09);}
.auth-tab{flex:1;padding:10px;text-align:center;font-family:'DM Mono',monospace;font-size:0.45rem;letter-spacing:0.22em;text-transform:uppercase;color:rgba(255,255,255,0.22);cursor:pointer;border-bottom:2px solid transparent;transition:0.3s;margin-bottom:-1px;}
.auth-tab.active{color:rgba(255,255,255,0.85);border-bottom-color:rgba(255,255,255,0.85);}
.auth-panel{display:none;flex-direction:column;gap:14px;}
.auth-panel.active{display:flex;}
.auth-field{display:flex;flex-direction:column;gap:6px;}
.auth-label{font-family:'DM Mono',monospace;font-size:0.38rem;letter-spacing:0.25em;text-transform:uppercase;color:rgba(255,255,255,0.28);}
.auth-input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.09);color:var(--white);font-family:'DM Mono',monospace;font-size:0.6rem;letter-spacing:0.08em;padding:13px 16px;outline:none;transition:border-color 0.3s;width:100%;}
.auth-input:focus{border-color:rgba(255,255,255,0.30);}
.auth-input::placeholder{color:rgba(122,122,122,0.45);}
.auth-btn-primary{background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);color:var(--black);border:none;font-family:'Bebas Neue',sans-serif;font-size:0.95rem;letter-spacing:0.3em;padding:15px;cursor:pointer;transition:0.3s;margin-top:4px;position:relative;overflow:hidden;}
.auth-btn-primary:hover{background:var(--gold-bright);}
.auth-btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.auth-btn-primary.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);animation:authShimmer 1.1s infinite;}
@keyframes authShimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.auth-divider{display:flex;align-items:center;gap:14px;margin:4px 0;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}
.auth-divider span{font-family:'DM Mono',monospace;font-size:0.36rem;letter-spacing:0.28em;color:rgba(122,122,122,0.45);text-transform:uppercase;}
.auth-btn-google{background:rgba(255,255,255,0.03);border:1px solid rgba(197,160,89,0.18);color:var(--white);font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.14em;padding:13px 16px;cursor:pointer;transition:0.3s;display:flex;align-items:center;justify-content:center;gap:12px;text-transform:uppercase;}
.auth-btn-google:hover{background:rgba(255,255,255,0.07);border-color:rgba(197,160,89,0.38);}
.auth-btn-google svg{flex-shrink:0;width:17px;height:17px;}
.auth-msg{font-family:'DM Mono',monospace;font-size:0.38rem;letter-spacing:0.15em;padding:10px 14px;text-align:center;display:none;}
.auth-msg.error{color:#e74c3c;background:rgba(231,76,60,0.07);border:1px solid rgba(231,76,60,0.2);}
.auth-msg.success{color:#27ae60;background:rgba(39,174,96,0.07);border:1px solid rgba(39,174,96,0.2);}
.auth-msg.show{display:block;}
.auth-forgot{text-align:right;margin-top:-6px;}
.auth-forgot a{font-family:'DM Mono',monospace;font-size:0.37rem;letter-spacing:0.14em;color:rgba(255,255,255,0.22);text-decoration:none;cursor:pointer;transition:0.3s;}
.auth-forgot a:hover{color:rgba(255,255,255,0.85);}

@media(max-width:768px){
  nav{padding:0 24px;}
  .nav-user-name{display:none;}
  .hero-content{padding:0 24px 60px;}
  .article-wrap{padding:60px 24px 80px;}
  .story-end{padding:0 24px 60px;}
  footer{flex-direction:column;gap:16px;text-align:center;padding:40px 24px;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);}
  .block-img-full{width:100%;margin-left:0;}
  .block-cols{grid-template-columns:1fr;}
  #auth-card{padding:44px 28px 36px;}
}
</style>
</head>
<body>

<div class="progress-bar" id="progress-bar"></div>
<div class="cursor" id="cursor">

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function getParam(key) { return new URLSearchParams(window.location.search).get(key); }
function getYtId(url){ const m=(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
function getVimeoId(url){ const m=(url||'').match(/vimeo\.com\/(\d+)/); return m?m[1]:null; }
function toRoman(n){ const r=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII']; return r[n-1]||String(n); }

// ══════════════════════════════════════════════
// RENDER BLOCKS
// ══════════════════════════════════════════════
function renderBlocks(blocks) {
  if (!Array.isArray(blocks) || !blocks.length) return '';
  return blocks.map((b, i) => {
    const al = b.align ? `style="text-align:${b.align}"` : '';
    switch(b.type) {
      case 'paragraph':
        return `<p class="block-p" ${al}>${b.content.replace(/\n/g,'<br>')}</p>`;
      case 'heading':
        return `<h2 class="block-h" ${al}>${b.content}</h2>`;
      case 'quote':
        return `<blockquote class="block-q">${b.content}</blockquote>`;
      case 'pullquote':
        return `<div class="block-pq">${b.content}</div>`;
      case 'caption':
        return `<div class="block-cap" ${al}>${b.content}</div>`;
      case 'divider':
        return `<hr class="block-hr">`;
      case 'image':
        if (!b.imageUrl) return '';
        const filter = `filter:brightness(${b.imgBrightness||100}%) contrast(${b.imgContrast||100}%)`;
        return `<img class="block-img" src="${b.imageUrl}" style="${filter}" alt="" onclick="openLightbox('${b.imageUrl}')">`;
      case 'columns':
        return `<div class="block-cols"><p class="block-p">${(b.col1||'').replace(/\n/g,'<br>')}</p><p class="block-p">${(b.col2||'').replace(/\n/g,'<br>')}</p></div>`;
      case 'video': {
        const eid = getYtId(b.videoUrl||''), vid = getVimeoId(b.videoUrl||'');
        const src = eid ? `https://www.youtube.com/embed/${eid}` : vid ? `https://player.vimeo.com/video/${vid}` : null;
        return src ? `<div class="block-video"><iframe src="${src}" allowfullscreen loading="lazy"></iframe></div>` : '';
      }
      case 'link':
        return b.linkUrl ? `<a class="block-link" href="${b.linkUrl}" target="_blank" rel="noopener noreferrer">${b.linkLabel||b.linkUrl}</a>` : '';
      default:
        return '';
    }
  }).join('');
}

// ══════════════════════════════════════════════
// RENDER GALLERY
// ══════════════════════════════════════════════
function renderGallery(urls) {
  if (!Array.isArray(urls) || !urls.length) return '';
  const colClass = urls.length === 1 ? 'cols-1' : urls.length === 2 ? 'cols-2' : '';
  return `<div class="gallery-section">
    <div class="gallery-title">Galería</div>
    <div class="gallery-grid ${colClass}">
      ${urls.map(url => `<div class="gallery-item" onclick="openLightbox('${url}')"><img src="${url}" alt="" loading="lazy"></div>`).join('')}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// RENDER STORY
// ══════════════════════════════════════════════
function renderStory(s) {
  const hasCover  = !!s.cover_url;
  const typeLabel = { historia:'Antecedentes', satira:'Sátira', ensayo:'Ensayo', imagen:'Visual', otro:'Producción' }[s.type] || 'Historia';
  const dateStr   = s.created_at ? new Date(s.created_at).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}) : '';
  const tagsHtml  = Array.isArray(s.tags) && s.tags.length ? `<div class="tags-row">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : '';
  const bgStyle   = hasCover ? `background-image:url('${s.cover_url}');background-position:${s.cover_position||'center'}` : '';

  document.title = `${s.title} — LW. Studios`;

  return `
    <section class="story-hero ${hasCover?'':'no-cover'}">
      ${hasCover ? `<div class="hero-bg" id="hero-bg" style="${bgStyle}"></div><div class="hero-overlay"></div><div class="hero-overlay-side"></div>` : ''}
      <div class="hero-content">
        <div class="hero-eyebrow">${typeLabel}${s.vol?` &nbsp;·&nbsp; Vol. ${toRoman(s.vol)}`:''}</div>
        <h1 class="story-title">${s.title}</h1>
        ${s.tagline ? `<p class="story-tagline">${s.tagline}</p>` : ''}
        ${tagsHtml}
        <div class="hero-meta">
          ${dateStr ? `<div class="meta-item"><div class="meta-label">Fecha</div><div class="meta-value">${dateStr}</div></div><div class="meta-sep"></div>` : ''}
          <div class="meta-item"><div class="meta-label">Tipo</div><div class="meta-value">${typeLabel}</div></div>
          ${s.vol ? `<div class="meta-sep"></div><div class="meta-item"><div class="meta-label">Volumen</div><div class="meta-value">${toRoman(s.vol)}</div></div>` : ''}
        </div>
      </div>
      
    </section>

    <article class="article-wrap">${renderBlocks(s.blocks)}</article>

    ${renderGallery(s.gallery_urls)}

    <div class="story-end">
      <div class="end-rule"><div class="end-mark">◈ FIN</div></div>
      <div class="end-title">Liberty Works Studios</div>
      <div class="end-sub">Construyendo mundos con palabras.</div>
      <div class="end-actions">
        <a href="index.html" class="btn-back hover-target">← Volver al archivo</a>
        <button class="btn-share hover-target" onclick="shareStory()">Compartir historia</button>
      </div>
    </div>

    <footer>
      <a href="index.html" class="footer-logo">LW.<span>STUDIOS</span></a>
      <div class="footer-copy">© 2026 Liberty Works Studios — Todos los derechos reservados</div>
    </footer>
  `;
}

function renderError(msg) {
  return `<div class="state-screen">
    <div class="state-icon">◈</div>
    <div class="state-title">Historia no encontrada</div>
    <div class="state-sub">${msg||'Esta historia no existe o ha sido eliminada'}</div>
    <br>

// ══════════════════════════════════════════════
// REVEAL OBSERVER
// ══════════════════════════════════════════════
function initReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

// ══════════════════════════════════════════════
// HOVER TARGETS
// ══════════════════════════════════════════════
function initHover() {
  document.querySelectorAll('.hover-target').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hovered'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hovered'));
  });
}

// ══════════════════════════════════════════════
// SHARE
// ══════════════════════════════════════════════
function shareStory() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: window.location.href }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.querySelector('.btn-share');
      if (btn) { btn.textContent = '✓ Enlace copiado'; setTimeout(() => btn.textContent = 'Compartir historia', 2000); }
    });
  }
}

// ══════════════════════════════════════════════
// LOAD STORY
// ══════════════════════════════════════════════
async function loadStory() {
  const root = document.getElementById('story-root');
  const id   = getParam('id');
  const slug = getParam('slug');
  if (!id && !slug) { root.innerHTML = renderError('No se especificó ningún antecedente'); return; }
  try {
    const url = slug
      ? `${SB_URL}/rest/v1/stories?slug=eq.${encodeURIComponent(slug)}&limit=1`
      : `${SB_URL}/rest/v1/stories?id=eq.${encodeURIComponent(id)}&limit=1`;
    const res  = await fetch(url, { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } });
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) { root.innerHTML = renderError('Antecedente no encontrado'); return; }
    const story = data[0];
    root.innerHTML = renderStory(story);
    setTimeout(() => { const bg = document.getElementById('hero-bg'); if(bg) bg.classList.add('loaded'); }, 100);
    initReveal();
    initHover();
  } catch(e) {
    root.innerHTML = renderError('Error al conectar con el servidor');
  }
}

// ══════════════════════════════════════════════
// AUTH — NAV
// ══════════════════════════════════════════════
function updateNavAuth(user) {
  const btn     = document.getElementById('nav-auth-btn');
  const menu    = document.getElementById('nav-user-menu');
  const nameEl  = document.getElementById('nav-user-name');
  const avatarEl= document.getElementById('nav-avatar-inner');
  if (user) {
    if (btn)  btn.style.display = 'none';
    if (menu) menu.classList.add('visible');
    const name  = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Agente';
    const photo = user.user_metadata?.avatar_url || user.user_metadata?.picture;
    if (nameEl)   nameEl.textContent = name.toUpperCase();
    if (avatarEl) avatarEl.innerHTML = photo ? `<img src="${photo}" alt="">` : (name[0]||'A').toUpperCase();
  } else {
    if (btn)  btn.style.display = '';
    if (menu) menu.classList.remove('visible');
  }
}

// ══════════════════════════════════════════════
// AUTH — MODAL
// ══════════════════════════════════════════════
function openAuthModal(tab='login') {
  document.getElementById('auth-modal').classList.add('open');
  authSwitchTab(tab);
  document.body.style.overflow = 'hidden';
}
function closeAuthModal() {
  document.getElementById('auth-modal').classList.remove('open');
  document.body.style.overflow = '';
  authClearMessages();
}
function authSwitchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
  const p = document.getElementById('auth-panel-' + tab);
  if (p) p.classList.add('active');
}
function authShowMsg(id, text, type) { const e=document.getElementById(id); if(!e)return; e.textContent=text; e.className='auth-msg '+type+' show'; }
function authClearMessages() { document.querySelectorAll('.auth-msg').forEach(e=>{e.className='auth-msg';e.textContent='';}); }
function authSetLoading(id, on) { const b=document.getElementById(id); if(!b)return; b.disabled=on; b.classList.toggle('loading',on); }

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email||!pass) { authShowMsg('login-msg','Completá todos los campos.','error'); return; }
  authSetLoading('login-btn',true); authClearMessages();
  const {data,error} = await _sbAuth.auth.signInWithPassword({email,password:pass});
  authSetLoading('login-btn',false);
  if (error) { authShowMsg('login-msg', error.message.includes('Invalid')?'Email o contraseña incorrectos.':error.message.includes('confirmed')?'Verificá tu email primero.':'Error al iniciar sesión.','error'); return; }
  closeAuthModal(); updateNavAuth(data.user);
}

async function handleRegister() {
  const name  = document.getElementById('register-name').value.trim();
  const email = document.getElementById('register-email').value.trim();
  const pass  = document.getElementById('register-pass').value;
  if (!name||!email||!pass) { authShowMsg('register-msg','Completá todos los campos.','error'); return; }
  if (pass.length < 8) { authShowMsg('register-msg','La contraseña debe tener al menos 8 caracteres.','error'); return; }
  authSetLoading('register-btn',true); authClearMessages();
  const {error} = await _sbAuth.auth.signUp({email,password:pass,options:{data:{full_name:name},emailRedirectTo:window.location.origin}});
  authSetLoading('register-btn',false);
  if (error) { authShowMsg('register-msg', error.message.includes('already')?'Este email ya está registrado.':'Error al crear la cuenta.','error'); return; }
  authShowMsg('register-msg','✓ Cuenta creada. Revisá tu email para confirmar.','success');
  ['register-name','register-email','register-pass'].forEach(id => document.getElementById(id).value='');
}

async function handleGoogleAuth() {
  const {error} = await _sbAuth.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin,queryParams:{access_type:'offline',prompt:'consent'}}});
  if (error) authShowMsg('login-msg','Error al conectar con Google.','error');
}

async function handleForgotPassword() {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) { authShowMsg('forgot-msg','Ingresá tu email.','error'); return; }
  authSetLoading('forgot-btn',true); authClearMessages();
  const {error} = await _sbAuth.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset-password.html'});
  authSetLoading('forgot-btn',false);
  if (error) { authShowMsg('forgot-msg','Error al enviar el email.','error'); return; }
  authShowMsg('forgot-msg','✓ Enlace enviado. Revisá tu bandeja.','success');
}

async function handleLogout() { await _sbAuth.auth.signOut(); updateNavAuth(null); }

// Event listeners del modal
document.getElementById('auth-close').addEventListener('click', closeAuthModal);
document.getElementById('auth-backdrop').addEventListener('click', closeAuthModal);
document.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => authSwitchTab(t.dataset.tab)));
document.getElementById('login-btn').addEventListener('click', handleLogin);
document.getElementById('register-btn').addEventListener('click', handleRegister);
document.getElementById('login-google-btn').addEventListener('click', handleGoogleAuth);
document.getElementById('register-google-btn').addEventListener('click', handleGoogleAuth);
document.getElementById('forgot-btn').addEventListener('click', handleForgotPassword);
document.getElementById('forgot-link').addEventListener('click', () => {
  document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('auth-panel-forgot').classList.add('active');
});
document.getElementById('back-to-login').addEventListener('click', () => authSwitchTab('login'));
document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
document.getElementById('register-pass').addEventListener('keydown', e => { if(e.key==='Enter') handleRegister(); });
document.getElementById('forgot-email').addEventListener('keydown', e => { if(e.key==='Enter') handleForgotPassword(); });

// Sesión persistente entre páginas
_sbAuth.auth.onAuthStateChange((event, session) => {
  updateNavAuth(session?.user || null);
  if (event === 'SIGNED_IN') closeAuthModal();
});
_sbAuth.auth.getSession().then(({data:{session}}) => updateNavAuth(session?.user || null));

window.openAuthModal = openAuthModal;
window.handleLogout  = handleLogout;

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
loadStory();
</script>
