<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LW. Studios — Historia</title>
<link rel="icon" href="FAVICON2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c5a059;
  --gold-bright: #f0d78c;
  --gold-deep: #846a32;
  --white: #f5f3ee;
  --silver: #d1d1d1;
  --smoke: #7a7a7a;
  --black: #080808;
  --surface: #0f0e0a;
  --border: rgba(197,160,89,0.15);
  --border-strong: rgba(197,160,89,0.3);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Cormorant Garamond',serif;min-height:100vh;overflow-x:hidden;}
@media(hover:hover) and (pointer:fine){*,*::before,*::after{cursor:none!important;}}

/* NOISE OVERLAY */
body::after{content:'';position:fixed;inset:0;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;}

/* CURSOR */
.cursor{position:fixed;width:6px;height:6px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);display:none;}
.cursor-ring{position:fixed;width:28px;height:28px;border:1px solid rgba(197,160,89,0.3);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width 0.3s cubic-bezier(.16,1,.3,1),height 0.3s cubic-bezier(.16,1,.3,1),border-color 0.3s;display:none;}
.cursor-ring.hovered{width:48px;height:48px;border-color:rgba(197,160,89,0.6);}
@media(hover:hover) and (pointer:fine){.cursor,.cursor-ring{display:block;}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:0 72px;height:72px;transition:0.5s;}
nav.scrolled{background:rgba(8,8,8,0.94);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:0.12em;color:var(--white);text-decoration:none;}
.nav-logo span{color:transparent;-webkit-text-stroke:1px var(--gold);}
.nav-back{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--smoke);text-decoration:none;transition:0.3s;display:flex;align-items:center;gap:10px;}
.nav-back::before{content:'←';font-size:0.7rem;transition:transform 0.3s;}
.nav-back:hover{color:var(--gold);}
.nav-back:hover::before{transform:translateX(-4px);}

/* HERO COVER */
.story-hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:flex-end;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.05);transition:transform 8s ease-out;}
.hero-bg.loaded{transform:scale(1);}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(8,8,8,0.2) 0%, rgba(8,8,8,0.1) 30%, rgba(8,8,8,0.7) 70%, rgba(8,8,8,1) 100%);}
.hero-overlay-side{position:absolute;inset:0;background:linear-gradient(to right, rgba(8,8,8,0.6) 0%, transparent 50%);}
.hero-content{position:relative;z-index:10;padding:0 72px 80px;width:100%;max-width:900px;}
.hero-eyebrow{display:flex;align-items:center;gap:14px;font-family:'DM Mono',monospace;font-size:0.48rem;color:var(--gold);letter-spacing:0.35em;text-transform:uppercase;margin-bottom:24px;opacity:0;animation:fadeUp 1s 0.3s both;}
.hero-eyebrow::before{content:'';display:block;width:28px;height:1px;background:var(--gold);}
.story-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.5rem,9vw,7rem);line-height:0.88;letter-spacing:0.02em;color:var(--white);margin-bottom:20px;opacity:0;animation:fadeUp 1.1s 0.45s both;}
.story-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,2.5vw,1.5rem);color:var(--silver);line-height:1.5;max-width:560px;opacity:0;animation:fadeUp 1s 0.6s both;}
.hero-meta{display:flex;align-items:center;gap:32px;margin-top:36px;padding-top:28px;border-top:1px solid var(--border);opacity:0;animation:fadeUp 1s 0.75s both;}
.meta-item{display:flex;flex-direction:column;gap:5px;}
.meta-label{font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(197,160,89,0.5);letter-spacing:0.3em;text-transform:uppercase;}
.meta-value{font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--silver);letter-spacing:0.15em;}
.meta-sep{width:1px;height:36px;background:var(--border);}
.hero-scroll-hint{position:absolute;bottom:32px;right:72px;z-index:10;font-family:'DM Mono',monospace;font-size:0.36rem;color:rgba(197,160,89,0.4);letter-spacing:0.3em;text-transform:uppercase;display:flex;align-items:center;gap:10px;opacity:0;animation:fadeUp 1s 1.1s both;}
.hero-scroll-hint::after{content:'';display:block;width:1px;height:40px;background:var(--border-strong);}

/* NO COVER VERSION */
.story-hero.no-cover{height:auto;min-height:0;padding-top:120px;}
.story-hero.no-cover .hero-bg{display:none;}
.story-hero.no-cover .hero-overlay,.story-hero.no-cover .hero-overlay-side{display:none;}
.story-hero.no-cover .hero-content{padding:80px 72px 60px;max-width:100%;}
.story-hero.no-cover .story-title{font-size:clamp(3rem,8vw,6rem);}

/* TAGS */
.tags-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;opacity:0;animation:fadeUp 1s 0.85s both;}
.tag{font-family:'DM Mono',monospace;font-size:0.34rem;letter-spacing:0.2em;text-transform:uppercase;padding:4px 12px;border:1px solid var(--border-strong);color:var(--gold);background:rgba(197,160,89,0.06);}

/* ARTICLE BODY */
.article-wrap{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:80px 40px 120px;}

/* READING PROGRESS */
.progress-bar{position:fixed;top:0;left:0;height:2px;background:var(--gold);z-index:9999;width:0%;transition:width 0.1s linear;box-shadow:0 0 8px rgba(197,160,89,0.4);}

/* CONTENT BLOCKS */
.block-p{font-family:'Cormorant Garamond',serif;font-size:1.25rem;line-height:1.9;color:var(--silver);margin-bottom:32px;font-weight:300;}
.block-p:first-child::first-letter{font-size:4.5rem;font-weight:600;line-height:0.75;float:left;margin:8px 16px 0 0;color:var(--gold);font-style:normal;}
.block-h{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:0.04em;color:var(--white);margin:60px 0 20px;line-height:1;}
.block-q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.5rem;line-height:1.6;color:var(--gold);border-left:2px solid var(--gold);padding:8px 0 8px 28px;margin:48px 0;position:relative;}
.block-q::before{content:'"';position:absolute;top:-20px;left:20px;font-size:5rem;color:rgba(197,160,89,0.12);line-height:1;font-style:normal;}
.block-cap{font-family:'DM Mono',monospace;font-size:0.44rem;color:var(--smoke);letter-spacing:0.18em;text-align:center;margin:-12px 0 28px;line-height:1.6;}
.block-hr{border:none;border-top:1px solid var(--border);margin:56px 0;position:relative;}
.block-hr::after{content:'◈';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--black);color:var(--gold);font-size:0.6rem;padding:0 16px;}
.block-img{width:100%;max-height:600px;object-fit:cover;display:block;margin:40px 0;border:1px solid var(--border);}
.block-img-full{width:calc(100% + 80px);margin-left:-40px;max-height:700px;object-fit:cover;display:block;margin-top:48px;margin-bottom:48px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.block-video{position:relative;padding-bottom:56.25%;height:0;margin:48px 0;overflow:hidden;border:1px solid var(--border);}
.block-video iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

/* GALLERY */
.gallery-section{position:relative;z-index:10;padding:0 0 80px;max-width:1200px;margin:0 auto;}
.gallery-title{font-family:'DM Mono',monospace;font-size:0.42rem;color:rgba(197,160,89,0.4);letter-spacing:0.35em;text-transform:uppercase;padding:0 40px 24px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px 0;}
.gallery-grid.cols-2{grid-template-columns:repeat(2,1fr);}
.gallery-grid.cols-1{grid-template-columns:1fr;max-width:720px;margin:0 auto;}
.gallery-item{aspect-ratio:4/3;overflow:hidden;position:relative;cursor:zoom-in;}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform 0.6s cubic-bezier(.16,1,.3,1);}
.gallery-item:hover img{transform:scale(1.04);}
.gallery-item:first-child:nth-last-child(1){aspect-ratio:16/7;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.96);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.lightbox.open{opacity:1;pointer-events:auto;}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border:1px solid var(--border);}
.lightbox-close{position:absolute;top:32px;right:40px;font-family:'DM Mono',monospace;font-size:0.5rem;color:var(--smoke);letter-spacing:0.25em;text-transform:uppercase;cursor:pointer;transition:color 0.2s;}
.lightbox-close:hover{color:var(--white);}

/* END SECTION */
.story-end{position:relative;z-index:10;max-width:720px;margin:0 auto;padding:0 40px 80px;}
.end-rule{display:flex;align-items:center;gap:24px;margin-bottom:48px;}
.end-rule::before,.end-rule::after{content:'';flex:1;height:1px;background:var(--border);}
.end-mark{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--gold);letter-spacing:0.2em;}
.end-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--white);margin-bottom:12px;letter-spacing:0.04em;}
.end-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--smoke);margin-bottom:36px;line-height:1.6;}
.end-actions{display:flex;gap:12px;flex-wrap:wrap;}
.btn-back{padding:14px 36px;border:1px solid var(--border-strong);font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--white);text-decoration:none;transition:0.3s;}
.btn-back:hover{border-color:var(--gold);color:var(--gold);}
.btn-share{padding:14px 36px;background:var(--gold);border:1px solid var(--gold);font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--black);cursor:pointer;transition:0.3s;}
.btn-share:hover{background:var(--gold-bright);border-color:var(--gold-bright);}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:48px 72px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--white);text-decoration:none;letter-spacing:0.12em;}
.footer-logo span{color:var(--gold);}
.footer-copy{font-family:'DM Mono',monospace;font-size:0.38rem;color:var(--smoke);letter-spacing:0.2em;text-transform:uppercase;}

/* LOADING / ERROR */
.state-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;}
.state-icon{font-size:3rem;opacity:0.3;}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--smoke);letter-spacing:0.04em;}
.state-sub{font-family:'DM Mono',monospace;font-size:0.44rem;color:rgba(122,122,122,0.5);letter-spacing:0.2em;text-transform:uppercase;}
.loader-ring{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px);}to{opacity:1;transform:translateY(0);}}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.9s cubic-bezier(.16,1,.3,1),transform 0.9s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--black);}
::-webkit-scrollbar-thumb{background:var(--border-strong);}

@media(max-width:768px){
  nav{padding:0 24px;}
  .hero-content{padding:0 24px 60px;}
  .article-wrap{padding:60px 24px 80px;}
  .story-end{padding:0 24px 60px;}
  footer{flex-direction:column;gap:16px;text-align:center;padding:40px 24px;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);}
  .block-img-full{width:100%;margin-left:0;}
}
</style>
</head>
<body>

<div class="progress-bar" id="progress-bar"></div>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- NAV -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo">LW.<span>STUDIOS</span></a>
  <a href="index.html" class="nav-back hover-target">Volver al archivo</a>
</nav>

<!-- CONTENIDO DINÁMICO -->
<div id="story-root">
  <div class="state-screen">
    <div class="loader-ring"></div>
    <div class="state-sub">Cargando historia...</div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-close">✕ Cerrar</div>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const SB_URL = 'https://xkntclywhhdtniosjuxo.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrbnRjbHl3aGhkdG5pb3NqdXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzExNDAsImV4cCI6MjA5MjcwNzE0MH0.aPAYF_rdsvCXzaLg_3bKTX7F7eoRGq1k_WL-r6NEdZ8';

// ══════════════════════════════════════════════
// CURSOR
// ══════════════════════════════════════════════
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
if (!('ontouchstart' in window)) {
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove', e=>{mx=e.clientX;my=e.clientY;});
  function trackCursor(){
    rx+=(mx-rx)*0.28; ry+=(my-ry)*0.28;
    cursor.style.left=mx+'px'; cursor.style.top=my+'px';
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(trackCursor);
  }
  trackCursor();
}

// ══════════════════════════════════════════════
// SCROLL EFFECTS
// ══════════════════════════════════════════════
window.addEventListener('scroll', () => {
  document.getElementById('main-nav').classList.toggle('scrolled', window.scrollY > 60);
  // Reading progress
  const doc = document.documentElement;
  const pct = (window.scrollY / (doc.scrollHeight - doc.clientHeight)) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
});

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}
function getYtId(url){ const m=(url||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
function getVimeoId(url){ const m=(url||'').match(/vimeo\.com\/(\d+)/); return m?m[1]:null; }
function toRoman(n){ const r=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII']; return r[n-1]||String(n); }

// ══════════════════════════════════════════════
// RENDER BLOCKS
// ══════════════════════════════════════════════
function renderBlocks(blocks) {
  if (!Array.isArray(blocks) || blocks.length === 0) return '';
  return blocks.map((b, i) => {
    switch(b.type) {
      case 'paragraph':
        return `<p class="block-p reveal">${b.content.replace(/\n/g,'<br>')}</p>`;
      case 'heading':
        return `<h2 class="block-h reveal">${b.content}</h2>`;
      case 'quote':
        return `<blockquote class="block-q reveal">${b.content}</blockquote>`;
      case 'caption':
        return `<div class="block-cap reveal">${b.content}</div>`;
      case 'divider':
        return `<hr class="block-hr reveal">`;
      case 'image':
        if (!b.imageUrl) return '';
        // Alternate full-bleed every other image after the first
        const cls = i > 0 && i % 3 === 0 ? 'block-img-full' : 'block-img';
        return `<img class="${cls} reveal" src="${b.imageUrl}" alt="" onclick="openLightbox('${b.imageUrl}')">`;
      case 'video':
        const eid = getYtId(b.videoUrl);
        const vid = getVimeoId(b.videoUrl);
        const src = eid ? `https://www.youtube.com/embed/${eid}?rel=0` : vid ? `https://player.vimeo.com/video/${vid}` : null;
        if (!src) return '';
        return `<div class="block-video reveal"><iframe src="${src}" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>`;
      default: return '';
    }
  }).join('');
}

// ══════════════════════════════════════════════
// RENDER GALLERY
// ══════════════════════════════════════════════
function renderGallery(urls) {
  if (!Array.isArray(urls) || urls.length === 0) return '';
  const colsClass = urls.length === 1 ? 'cols-1' : urls.length === 2 ? 'cols-2' : '';
  return `
    <div class="gallery-section reveal">
      <div class="gallery-title">Galería</div>
      <div class="gallery-grid ${colsClass}">
        ${urls.map(url => `
          <div class="gallery-item" onclick="openLightbox('${url}')">
            <img src="${url}" alt="" loading="lazy">
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ══════════════════════════════════════════════
// RENDER PAGE
// ══════════════════════════════════════════════
function renderStory(s) {
  const hasCover = !!s.cover_url;
  const typeLabel = { historia:'Historia', satira:'Sátira', ensayo:'Ensayo', imagen:'Visual', otro:'Producción' }[s.type] || 'Historia';
  const dateStr = s.created_at ? new Date(s.created_at).toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}) : '';
  const tagsHtml = Array.isArray(s.tags) && s.tags.length
    ? `<div class="tags-row">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : '';

  const heroClass = hasCover ? '' : 'no-cover';
  const bgStyle = hasCover ? `background-image:url('${s.cover_url}')` : '';

  document.title = `${s.title} — LW. Studios`;

  return `
    <!-- HERO -->
    <section class="story-hero ${heroClass}">
      ${hasCover ? `<div class="hero-bg" id="hero-bg" style="${bgStyle}"></div><div class="hero-overlay"></div><div class="hero-overlay-side"></div>` : ''}
      <div class="hero-content">
        <div class="hero-eyebrow">${typeLabel}${s.vol ? ` &nbsp;·&nbsp; Vol. ${toRoman(s.vol)}` : ''}</div>
        <h1 class="story-title">${s.title}</h1>
        ${s.tagline ? `<p class="story-tagline">${s.tagline}</p>` : ''}
        ${tagsHtml}
        <div class="hero-meta">
          ${dateStr ? `<div class="meta-item"><div class="meta-label">Fecha</div><div class="meta-value">${dateStr}</div></div><div class="meta-sep"></div>` : ''}
          <div class="meta-item"><div class="meta-label">Tipo</div><div class="meta-value">${typeLabel}</div></div>
          ${s.vol ? `<div class="meta-sep"></div><div class="meta-item"><div class="meta-label">Volumen</div><div class="meta-value">${toRoman(s.vol)}</div></div>` : ''}
        </div>
      </div>
      ${hasCover ? `<div class="hero-scroll-hint">Leer</div>` : ''}
    </section>

    <!-- ARTICLE -->
    <article class="article-wrap">
      ${renderBlocks(s.blocks)}
    </article>

    <!-- GALLERY -->
    ${renderGallery(s.gallery_urls)}

    <!-- END -->
    <div class="story-end">
      <div class="end-rule"><div class="end-mark">◈ FIN</div></div>
      <div class="end-title">Liberty Works Studios</div>
      <div class="end-sub">Construyendo mundos con palabras.</div>
      <div class="end-actions">
        <a href="index.html" class="btn-back hover-target">← Volver al archivo</a>
        <button class="btn-share hover-target" onclick="shareStory()">Compartir historia</button>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <a href="index.html" class="footer-logo">LW.<span>STUDIOS</span></a>
      <div class="footer-copy">© 2026 Liberty Works Studios — Todos los derechos reservados</div>
    </footer>
  `;
}

function renderError(msg) {
  return `
    <div class="state-screen">
      <div class="state-icon">◈</div>
      <div class="state-title">Historia no encontrada</div>
      <div class="state-sub">${msg || 'Esta historia no existe o ha sido eliminada'}</div>
      <br>
      <a href="index.html" style="font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--gold);letter-spacing:0.2em;text-decoration:none;text-transform:uppercase;border:1px solid var(--border-strong);padding:12px 28px;margin-top:8px;display:inline-block;">← Volver al archivo</a>
    </div>
  `;
}

// ══════════════════════════════════════════════
// INIT REVEAL OBSERVER
// ══════════════════════════════════════════════
function initReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

// ══════════════════════════════════════════════
// HOVER TARGETS
// ══════════════════════════════════════════════
function initHover() {
  document.querySelectorAll('.hover-target').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hovered'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hovered'));
  });
}

// ══════════════════════════════════════════════
// LIGHTBOX
// ══════════════════════════════════════════════
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });

// ══════════════════════════════════════════════
// SHARE
// ══════════════════════════════════════════════
function shareStory() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: window.location.href }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(window.location.href).then(() => {
      const btn = document.querySelector('.btn-share');
      if (btn) { btn.textContent = '✓ Enlace copiado'; setTimeout(() => btn.textContent = 'Compartir historia', 2000); }
    });
  }
}

// ══════════════════════════════════════════════
// LOAD STORY
// ══════════════════════════════════════════════
async function loadStory() {
  const root = document.getElementById('story-root');
  const id   = getParam('id');
  const slug = getParam('slug');

  if (!id && !slug) { root.innerHTML = renderError('No se especificó ninguna historia'); return; }

  try {
    let url;
    if (slug) url = `${SB_URL}/rest/v1/stories?slug=eq.${encodeURIComponent(slug)}&limit=1`;
    else       url = `${SB_URL}/rest/v1/stories?id=eq.${encodeURIComponent(id)}&limit=1`;

    const res = await fetch(url, {
      headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
    });
    const data = await res.json();

    if (!Array.isArray(data) || data.length === 0) {
      root.innerHTML = renderError('Historia no encontrada en la base de datos');
      return;
    }

    const story = data[0];
    root.innerHTML = renderStory(story);

    // Animate hero bg
    setTimeout(() => {
      const bg = document.getElementById('hero-bg');
      if (bg) bg.classList.add('loaded');
    }, 100);

    initReveal();
    initHover();

  } catch(e) {
    root.innerHTML = renderError('Error al conectar con el servidor');
  }
}

loadStory();
</script>
</body>
</html>
