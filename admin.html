<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LW. Admin — Panel de Control</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c5a059; --gold-bright: #f0d78c; --gold-deep: #846a32;
  --white: #f5f3ee; --silver: #d1d1d1; --smoke: #7a7a7a;
  --black: #080808; --surface: #0f0e0a; --surface2: #161410;
  --surface3: #1e1b15; --border: rgba(197,160,89,0.15);
  --border-strong: rgba(197,160,89,0.3); --red: #c0392b; --green: #27ae60;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--white);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(140deg,#0a0907 0%,#15120c 50%,#040404 100%);
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px;
}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:0.15em;color:var(--white);}
.login-logo span{color:transparent;-webkit-text-stroke:1px var(--gold);}
.login-form{display:flex;flex-direction:column;gap:12px;width:320px;}
.login-form input{
  background:var(--surface2);border:1px solid var(--border);color:var(--white);
  padding:14px 18px;outline:none;font-family:'DM Mono';font-size:0.7rem;
}
.login-btn{background:var(--gold);color:var(--black);border:none;padding:14px;cursor:pointer;font-family:'Bebas Neue';font-size:1rem;letter-spacing:0.2em;}
.login-error{font-size:0.5rem;color:var(--red);text-align:center;display:none;}

/* LAYOUT */
#app{display:none;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
.sidebar-logo{padding:28px 24px;border-bottom:1px solid var(--border);}
.sidebar-logo span{color:transparent;-webkit-text-stroke:1px var(--gold);font-family:'Bebas Neue';}
.sidebar-nav{flex:1;padding:20px 0;}
.sidebar-nav a{display:block;padding:12px 24px;color:var(--smoke);text-decoration:none;text-transform:uppercase;font-size:0.5rem;letter-spacing:0.1em;}
.sidebar-nav a.active{color:var(--gold);background:rgba(197,160,89,0.05);border-left:2px solid var(--gold);}
.main-content{margin-left:240px;padding:40px;}

/* DASHBOARD & EDITOR */
.panel-hidden{display:none !important;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;}
.field-group{margin-bottom:20px;}
.field-label{font-size:0.4rem;color:var(--gold);text-transform:uppercase;margin-bottom:8px;display:block;}
.field-input{width:100%;background:var(--surface3);border:1px solid var(--border);color:white;padding:12px;outline:none;}
.btn{padding:10px 20px;cursor:pointer;background:var(--gold);border:none;font-family:'DM Mono';text-transform:uppercase;font-size:0.5rem;}
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-logo">LW.<span>STUDIOS</span></div>
    <div class="login-form">
        <input type="password" id="pwd-input" placeholder="CONTRASEÑA DE ACCESO">
        <button class="login-btn" onclick="doLogin()">ENTRAR AL PANEL</button>
        <div id="login-error" class="login-error">CONTRASEÑA INCORRECTA</div>
    </div>
</div>

<div id="app">
    <aside class="sidebar">
        <div class="sidebar-logo">LW.<span>STUDIOS</span></div>
        <nav class="sidebar-nav">
            <a href="#" class="active" onclick="showPanel('dashboard')">Dashboard</a>
            <a href="#" onclick="showPanel('new-story')">Nueva Historia</a>
        </nav>
    </aside>

    <main class="main-content">
        <div id="panel-dashboard">
            <h2>Bienvenido, Administrador</h2>
            <p style="color:var(--smoke); margin-top:10px;">Selecciona "Nueva Historia" para empezar a publicar.</p>
        </div>

        <div id="panel-new-story" class="panel-hidden">
            <div class="topbar">
                <h2 style="font-family:'Bebas Neue'; letter-spacing:2px;">NUEVA HISTORIA</h2>
            </div>
            <div class="field-group">
                <label class="field-label">Título</label>
                <input type="text" id="story-title" class="field-input" placeholder="Título de la obra">
            </div>
            <div class="field-group">
                <label class="field-label">Contenido</label>
                <textarea id="story-content" class="field-input" rows="10" placeholder="Escribe aquí..."></textarea>
            </div>
            <button class="btn" onclick="saveStory()">Publicar en Supabase</button>
        </div>
    </main>
</div>

<script>
// ════════════════════════════════════════════════
// CONFIGURACIÓN QUIRÚRGICA REALIZADA
// ════════════════════════════════════════════════
const SUPABASE_URL = 'https://xkntclywhhdtniosjuxo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrbnRjbHl3aGhkdG5pb3NqdXhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzExNDAsImV4cCI6MjA5MjcwNzE0MH0.aPAYF_rdsvCXzaLg_3bKTX7F7eoRGq1k_WL-r6NEdZ8';
const ADMIN_PASSWORD = '1234'; // Cambia esta contraseña después

function doLogin() {
    const pwd = document.getElementById('pwd-input').value;
    if (pwd === ADMIN_PASSWORD) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    } else {
        document.getElementById('login-error').style.display = 'block';
    }
}

function showPanel(name) {
    document.getElementById('panel-dashboard').classList.add('panel-hidden');
    document.getElementById('panel-new-story').classList.add('panel-hidden');
    document.getElementById(`panel-${name}`).classList.remove('panel-hidden');
}

async function saveStory() {
    const title = document.getElementById('story-title').value;
    const content = document.getElementById('story-content').value;

    if(!title || !content) return alert("Rellena los campos");

    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/historias`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({ titulo: title, contenido: content })
        });

        if (response.ok) {
            alert("¡Historia publicada con éxito!");
            location.reload();
        } else {
            alert("Error al conectar con la tabla. ¿Creaste la tabla 'historias' en Supabase?");
        }
    } catch (error) {
        console.error(error);
        alert("Error de conexión");
    }
}
</script>
</body>
</html>
