<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil — Liberty Works Studios</title>
<link rel="icon" href="FAVICON2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --gold: #b8bec8;
  --gold-bright: #dde3ec;
  --gold-deep: #6e7580;
  --white: #f5f3ee;
  --silver: #d1d1d1;
  --smoke: #7a7a7a;
  --black: #080808;
  --surface: #0f0f10;
  --surface2: #161618;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.18);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
@media(hover:hover) and (pointer:fine){*,*::before,*::after{cursor:none!important;}}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}

/* ── ATMÓSFERA ── */
body::before{content:'';position:fixed;inset:0;z-index:1;background:transparent;pointer-events:none;}
body::after{content:'';position:fixed;inset:0;z-index:2;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.025;pointer-events:none;}
#glow-top{position:fixed;top:-25vh;right:-20vw;width:90vw;height:90vw;background:radial-gradient(circle,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.02) 45%,transparent 70%);pointer-events:none;z-index:1;border-radius:50%;}
#glow-bot{position:fixed;bottom:-20vh;left:-15vw;width:65vw;height:65vw;background:radial-gradient(circle,rgba(255,255,255,0.04) 0%,rgba(50,40,20,0.04) 45%,transparent 70%);pointer-events:none;z-index:1;border-radius:50%;}
#dust-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3;opacity:0.18;}

/* ── CURSOR ── */
.cursor{position:fixed;width:18px;height:18px;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);display:none;transition:width 0.3s cubic-bezier(.16,1,.3,1),height 0.3s cubic-bezier(.16,1,.3,1);}
.cursor svg{width:100%;height:100%;display:block;transition:transform 0.4s cubic-bezier(.16,1,.3,1);filter:drop-shadow(0 0 4px rgba(255,255,255,0.38));}
.cursor.hovered{width:30px;height:30px;}
.cursor.hovered svg{transform:rotate(180deg);filter:drop-shadow(0 0 8px rgba(255,255,255,0.9));}
.cursor.on-negative{mix-blend-mode:difference;}
.cursor.on-negative svg{filter:drop-shadow(0 0 3px rgba(255,255,255,0.5));}
/* Aro eliminado — solo estrella */
.cursor-ring{display:none!important;}
@media(hover:hover) and (pointer:fine){.cursor{display:block;}}

/* ── PROGRESS ── */
#read-progress{position:fixed;top:0;left:0;height:2px;width:0%;background:linear-gradient(90deg,#6e7580,#b8bec8,#dde3ec);z-index:9000;pointer-events:none;transition:width 0.1s linear;box-shadow:0 0 8px rgba(255,255,255,0.28);}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;justify-content:space-between;align-items:center;padding:0 72px;height:72px;transition:0.5s;}
nav.scrolled{background:rgba(8,8,8,0.94);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:0.12em;color:var(--white);text-decoration:none;}
.nav-logo .ws{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,0.55);margin-left:3px;font-size:1.4rem;letter-spacing:0.18em;}
.nav-back{font-family:'DM Mono',monospace;font-size:0.46rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--smoke);text-decoration:none;transition:0.3s;display:flex;align-items:center;gap:10px;}
.nav-back::before{content:'←';font-size:0.7rem;transition:transform 0.3s;}
.nav-back:hover{color:var(--white);}
.nav-back:hover::before{transform:translateX(-4px);}

/* ── HERO DEL PERFIL ── */
.profile-hero{position:relative;padding:120px 72px 0;z-index:10;}
.profile-hero-inner{max-width:900px;margin:0 auto;display:flex;align-items:flex-end;gap:48px;padding-bottom:48px;border-bottom:1px solid var(--border);}

/* Avatar */
.avatar-wrap{position:relative;flex-shrink:0;}
.avatar-ring{width:128px;height:128px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color 0.3s;}
.avatar-ring:hover{border-color:var(--white);}
.avatar-ring img{width:100%;height:100%;object-fit:cover;}
.avatar-initial{font-family:'Bebas Neue',sans-serif;font-size:3rem;color:var(--white);opacity:0.6;}
.avatar-edit-btn{position:absolute;bottom:0;right:0;width:32px;height:32px;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);border:2px solid var(--black);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.75rem;color:#080808;font-weight:700;transition:0.3s;}
.avatar-edit-btn svg{color:#080808;stroke:#080808;}
.avatar-edit-btn:hover{background:rgba(255,255,255,0.95);transform:scale(1.1);}

/* Info */
.profile-info{flex:1;min-width:0;}
.profile-username{font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--white);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:6px;opacity:0.7;}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,5vw,3.5rem);color:var(--white);letter-spacing:0.03em;line-height:1;margin-bottom:16px;}
.profile-bio{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--silver);line-height:1.7;max-width:520px;opacity:0.8;}
.profile-bio.empty{font-size:0.5rem;color:var(--smoke);font-style:normal;font-family:'DM Mono',monospace;letter-spacing:0.15em;}
.profile-meta-row{display:flex;align-items:center;gap:28px;margin-top:24px;}
.profile-meta-item{display:flex;flex-direction:column;gap:4px;}
.profile-meta-label{font-size:0.34rem;color:rgba(255,255,255,0.22);letter-spacing:0.28em;text-transform:uppercase;}
.profile-meta-value{font-size:0.48rem;color:var(--silver);letter-spacing:0.12em;}
.profile-meta-sep{width:1px;height:28px;background:var(--border);}

/* Edit button */
.btn-edit-profile{font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.2em;text-transform:uppercase;background:transparent;border:1px solid var(--border-strong);color:var(--silver);padding:10px 24px;cursor:pointer;transition:0.3s;flex-shrink:0;align-self:flex-start;margin-top:8px;}
.btn-edit-profile:hover{border-color:var(--white);color:var(--white);}

/* ── CONTENIDO PRINCIPAL ── */
.profile-content{max-width:900px;margin:0 auto;padding:0 72px 120px;position:relative;z-index:10;}
.profile-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-top:40px;margin-bottom:48px;}
.profile-tab{font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--smoke);padding:14px 28px;cursor:pointer;border-bottom:2px solid transparent;transition:0.3s;margin-bottom:-1px;background:transparent;border-top:none;border-left:none;border-right:none;}
.profile-tab.active{color:var(--white);border-bottom-color:var(--white);}
.profile-tab:hover:not(.active){color:var(--silver);}

/* Panel vacío */
.tab-empty{text-align:center;padding:80px 20px;}
.tab-empty-icon{font-size:2.5rem;color:rgba(255,255,255,0.06);margin-bottom:20px;}
.tab-empty-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--smoke);letter-spacing:0.06em;margin-bottom:8px;}
.tab-empty-sub{font-size:0.42rem;color:rgba(122,122,122,0.5);letter-spacing:0.2em;line-height:1.8;}

/* ── MODAL DE EDICIÓN ── */
#edit-modal{position:fixed;inset:0;z-index:6000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s cubic-bezier(.4,0,.2,1);}
#edit-modal.open{opacity:1;pointer-events:auto;}
#edit-backdrop{position:absolute;inset:0;background:rgba(5,5,4,0.93);backdrop-filter:blur(14px);}
#edit-card{position:relative;z-index:1;background:#0c0c0e;border:1px solid var(--border-strong);width:92vw;max-width:560px;max-height:92vh;overflow-y:auto;padding:48px;transform:scale(0.92) translateY(24px);opacity:0;transition:transform 0.5s cubic-bezier(.16,1,.3,1),opacity 0.4s;scrollbar-width:none;}
#edit-modal.open #edit-card{transform:scale(1) translateY(0);opacity:1;}
.edit-corner{position:absolute;width:12px;height:12px;border-color:rgba(255,255,255,0.22);border-style:solid;}
.edit-corner.tl{top:10px;left:10px;border-width:1px 0 0 1px;}
.edit-corner.tr{top:10px;right:10px;border-width:1px 1px 0 0;}
.edit-corner.bl{bottom:10px;left:10px;border-width:0 0 1px 1px;}
.edit-corner.br{bottom:10px;right:10px;border-width:0 1px 1px 0;}
#edit-close{position:absolute;top:16px;right:18px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.28);width:32px;height:32px;font-size:0.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s;}
#edit-close:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.28);color:var(--white);}
.edit-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:0.05em;color:var(--white);margin-bottom:36px;}
.edit-section{margin-bottom:28px;}
.edit-label{font-size:0.36rem;color:rgba(255,255,255,0.28);letter-spacing:0.28em;text-transform:uppercase;margin-bottom:8px;display:block;}
.edit-input{background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--white);font-family:'DM Mono',monospace;font-size:0.52rem;letter-spacing:0.08em;padding:13px 16px;outline:none;transition:border-color 0.3s;width:100%;}
.edit-input:focus{border-color:rgba(255,255,255,0.28);}
.edit-input::placeholder{color:rgba(122,122,122,0.4);}
.edit-textarea{resize:vertical;min-height:90px;line-height:1.7;font-family:'Cormorant Garamond',serif;font-size:1rem;}
.edit-hint{font-size:0.34rem;color:rgba(122,122,122,0.45);letter-spacing:0.14em;margin-top:5px;}
.edit-hint.error{color:#c0392b;}
.edit-hint.ok{color:#27ae60;}

/* Username check */
.username-row{display:flex;align-items:center;gap:10px;}
.username-row .edit-input{flex:1;}
.username-status{font-size:0.55rem;flex-shrink:0;width:22px;text-align:center;}

/* Contador de cambios de identidad */
.identity-counter{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:12px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);position:relative;overflow:hidden;}
.identity-counter::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);}
.identity-counter-left{display:flex;flex-direction:column;gap:4px;}
.identity-counter-label{font-size:0.32rem;letter-spacing:0.28em;color:rgba(255,255,255,0.20);text-transform:uppercase;}
.identity-counter-slots{display:flex;gap:6px;align-items:center;}
.identity-slot{width:18px;height:4px;background:rgba(255,255,255,0.08);transition:background 0.3s;}
.identity-slot.used{background:rgba(255,255,255,0.18);}
.identity-slot.available{background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);box-shadow:0 0 6px rgba(255,255,255,0.22);}
.identity-counter-count{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:0.08em;color:rgba(255,255,255,0.38);line-height:1;}
.identity-counter-count.zero{color:rgba(180,80,60,0.6);}
.identity-sealed{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(180,60,40,0.04);border:1px solid rgba(180,60,40,0.15);margin-top:10px;}
.identity-sealed-icon{font-size:1rem;opacity:0.5;flex-shrink:0;}
.identity-sealed-text{font-size:0.36rem;letter-spacing:0.2em;color:rgba(180,100,80,0.6);line-height:1.7;text-transform:uppercase;}

/* Presets de avatar */
.avatar-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px;}
.preset-item{aspect-ratio:1;border:2px solid var(--border);border-radius:50%;cursor:pointer;transition:0.25s;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--surface2);overflow:hidden;}
.preset-item:hover{border-color:rgba(255,255,255,0.28);}
.preset-item.selected{border-color:var(--white);box-shadow:0 0 0 2px rgba(255,255,255,0.12);}
.preset-item img{width:100%;height:100%;object-fit:cover;}

/* Subir foto */
.avatar-upload-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.avatar-upload-preview{width:52px;height:52px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--smoke);}
.avatar-upload-preview img{width:100%;height:100%;object-fit:cover;}
.btn-upload{font-family:'DM Mono',monospace;font-size:0.4rem;letter-spacing:0.18em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--smoke);padding:8px 16px;cursor:pointer;transition:0.25s;}
.btn-upload:hover{border-color:var(--white);color:var(--white);}

/* Botones del modal */
.edit-actions{display:flex;gap:10px;margin-top:36px;}
.btn-save{flex:1;background:linear-gradient(135deg,#c8cdd6,#eceef2,#b0b6c0);color:var(--black);border:1px solid rgba(255,255,255,0.15);font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.3em;padding:14px;cursor:pointer;transition:0.3s;position:relative;overflow:hidden;}
.btn-save:hover{background:linear-gradient(135deg,#dde3ec,#ffffff,#c8cdd6);border-color:rgba(255,255,255,0.3);}
.btn-save:disabled{opacity:0.5;cursor:not-allowed;}
.btn-save.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);animation:shimmer 1.1s infinite;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--smoke);font-family:'DM Mono',monospace;font-size:0.44rem;letter-spacing:0.2em;text-transform:uppercase;padding:14px 24px;cursor:pointer;transition:0.3s;}
.btn-cancel:hover{border-color:var(--border-strong);color:var(--silver);}

/* Mensajes */
.edit-msg{font-size:0.38rem;letter-spacing:0.16em;padding:10px 14px;text-align:center;display:none;margin-top:12px;}
.edit-msg.error{color:#e74c3c;background:rgba(231,76,60,0.07);border:1px solid rgba(231,76,60,0.2);}
.edit-msg.success{color:#27ae60;background:rgba(39,174,96,0.07);border:1px solid rgba(39,174,96,0.2);}
.edit-msg.show{display:block;}

/* ── ESTADO DE CARGA / ERROR ── */
.state-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;position:relative;z-index:10;}
.loader-ring{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--white);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--smoke);letter-spacing:0.04em;}
.state-sub{font-size:0.42rem;color:rgba(122,122,122,0.5);letter-spacing:0.2em;text-transform:uppercase;}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;right:28px;background:var(--surface);border:1px solid var(--border-strong);color:var(--white);font-family:'DM Mono',monospace;font-size:0.42rem;letter-spacing:0.18em;padding:14px 22px;z-index:9000;transform:translateY(80px);opacity:0;transition:0.35s cubic-bezier(.16,1,.3,1);}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{color:#c0392b;border-color:rgba(192,57,43,0.3);}

/* ── REVEAL ── */
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.8s cubic-bezier(.16,1,.3,1),transform 0.8s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{display:none;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:transparent;}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  nav{padding:0 24px;}
  .profile-hero{padding:100px 24px 0;}
  .profile-hero-inner{flex-direction:column;align-items:flex-start;gap:28px;}
  .avatar-ring{width:96px;height:96px;}
  .profile-content{padding:0 24px 80px;}
  .profile-tabs{overflow-x:auto;scrollbar-width:none;}
  .profile-tab{white-space:nowrap;padding:14px 18px;}
  #edit-card{padding:36px 24px;}
  .avatar-presets{grid-template-columns:repeat(5,1fr);}
}
</style>
  <link rel="canonical" href="https://www.libertywks.com/perfil.html">
  <meta property="og:url" content="https://www.libertywks.com/perfil.html">
</head>
<body>

<div id="glow-top"></div>
<div id="glow-bot"></div>
<canvas id="dust-canvas"></canvas>
<div id="read-progress"></div>

<div class="cursor" id="cursor">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M12 2 L14.09 8.26 L20.85 8.27 L15.55 12.14 L17.64 18.39 L12 14.77 L6.36 18.39 L8.45 12.14 L3.15 8.27 L9.91 8.26 Z" fill="rgba(255,255,255,0.7)" stroke="rgba(255,255,255,0.9)" stroke-width="0.4"/>
  </svg>
</div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- NAV -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo">LIBERTY <span class="ws">W.S</span></a>
  <a href="index.html" class="nav-back hover-target">Volver al inicio</a>
</nav>

<!-- CONTENIDO DINÁMICO -->
<div id="profile-root">
  <div class="state-screen">
    <div class="loader-ring"></div>
    <div class="state-sub">Cargando perfil...</div>
  </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div id="edit-modal">
  <div id="edit-backdrop"></div>
  <div id="edit-card">
    <div class="edit-corner tl"></div><div class="edit-corner tr"></div>
    <div class="edit-corner bl"></div><div class="edit-corner br"></div>
    <button id="edit-close">✕</button>
    <div class="edit-title">Editar Perfil</div>

    <!-- Avatar -->
    <div class="edit-section">
      <label class="edit-label">Foto de perfil</label>
      <div class="avatar-upload-row">
        <div class="avatar-upload-preview" id="upload-preview">◈</div>
        <div>
          <input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="handleAvatarFile(event)">
          <button class="btn-upload hover-target" onclick="document.getElementById('avatar-file-input').click()">+ Subir foto</button>
          <div class="edit-hint" style="margin-top:6px">JPG, PNG o WEBP · Máx. 2 MB</div>
        </div>
      </div>
    </div>

    <!-- Avatares predeterminados -->
    <div class="edit-section">
      <label class="edit-label">O elegí un avatar</label>
      <div class="avatar-presets" id="avatar-presets"></div>
    </div>

    <!-- Nombre -->
    <div class="edit-section">
      <label class="edit-label">Nombre visible</label>
      <input type="text" class="edit-input" id="edit-name" placeholder="Tu nombre o alias" maxlength="48">
    </div>

    <!-- Username / Identidad -->
    <div class="edit-section" id="identity-section">
      <label class="edit-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>ID de Agente <span style="color:rgba(255,255,255,0.22);font-size:0.3rem;">(sin @)</span></span>
        <span id="changes-badge" style="font-size:0.3rem;letter-spacing:0.22em;color:rgba(255,255,255,0.22);"></span>
      </label>
      <div class="username-row" id="username-input-row">
        <input type="text" class="edit-input" id="edit-username" placeholder="cazador_de_sombras" maxlength="24" oninput="checkUsername(this.value)" style="text-transform:lowercase;">
        <span class="username-status" id="username-status"></span>
      </div>
      <div class="edit-hint" id="username-hint">Solo letras, números y guiones bajos.</div>
      <!-- Contador de cambios -->
      <div class="identity-counter" id="identity-counter" style="display:none;">
        <div class="identity-counter-left">
          <span class="identity-counter-label">Cambios de identidad restantes</span>
          <div class="identity-counter-slots" id="identity-slots"></div>
        </div>
        <span class="identity-counter-count" id="identity-count-num"></span>
      </div>

(function(){
  const c=document.getElementById('dust-canvas');
  const ctx=c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  const pts=Array.from({length:300},()=>({
    x:Math.random()*c.width,y:Math.random()*c.height,
    size:2+Math.random()*3,
    vx:(Math.random()-0.5)*0.1,vy:(Math.random()-0.5)*0.1,
    opacity:0.3+Math.random()*0.4
  }));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>c.width)p.vx*=-1;
      if(p.y<0||p.y>c.height)p.vy*=-1;
      ctx.save();ctx.translate(p.x,p.y);
      ctx.strokeStyle=`rgba(200,210,225,${p.opacity})`;
      ctx.lineWidth=1;ctx.beginPath();
      const r=p.size,ir=r/2.5;let rot=Math.PI/2*3;
      ctx.moveTo(0,-r);
      for(let i=0;i<5;i++){
        ctx.lineTo(Math.cos(rot)*r,Math.sin(rot)*r);rot+=Math.PI/5;
        ctx.lineTo(Math.cos(rot)*ir,Math.sin(rot)*ir);rot+=Math.PI/5;
      }
      ctx.closePath();ctx.stroke();ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// VALIDAR USERNAME EN TIEMPO REAL — sb client
// ══════════════════════════════════════════════
async function checkUsername(val){
  const hint   = document.getElementById('username-hint');
  const status = document.getElementById('username-status');
  clearTimeout(usernameTimer);

  if(!val){ hint.textContent='Solo letras, números y guiones bajos.'; hint.className='edit-hint'; status.textContent=''; usernameValid=true; return; }
  if(!/^[a-z0-9_]{3,24}$/.test(val)){
    hint.textContent='3–24 caracteres. Solo letras minúsculas, números y _.'; hint.className='edit-hint error'; status.textContent='✕'; usernameValid=false; return;
  }
  if(val === currentProfile?.username){ hint.textContent='Este es tu ID actual.'; hint.className='edit-hint ok'; status.textContent='✓'; usernameValid=true; return; }

  hint.textContent='Verificando...'; hint.className='edit-hint'; status.textContent='⋯'; usernameValid=false;

  usernameTimer = setTimeout(async()=>{
    const { data } = await sb.from('profiles').select('id').eq('username', val).maybeSingle();
    if(data){
      hint.textContent='Este ID ya está en uso.'; hint.className='edit-hint error'; status.textContent='✕'; usernameValid=false;
    } else {
      hint.textContent='¡ID disponible!'; hint.className='edit-hint ok'; status.textContent='✓'; usernameValid=true;
    }
  },600);
}

// ══════════════════════════════════════════════
// GUARDAR PERFIL — sb client (token automático)
// ══════════════════════════════════════════════
async function saveProfile(){
  if(!usernameValid){ showEditMsg('El ID elegido no está disponible.','error'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled=true; btn.classList.add('loading');

  let finalAvatarUrl   = currentProfile.avatar_url || null;
  let finalAvatarPreset= currentProfile.avatar_preset || null;

  // Convertir foto a base64 y guardar directo en profiles (sin necesitar Storage bucket)
  if(newAvatarFile){
    try {
      const base64 = await new Promise((res, rej) => {
        // Comprimir/redimensionar antes de guardar
        const img = new Image();
        const reader = new FileReader();
        reader.onload = ev => {
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 256;
            let w = img.width, h = img.height;
            if(w > h){ if(w > MAX){ h = Math.round(h*MAX/w); w = MAX; } }
            else      { if(h > MAX){ w = Math.round(w*MAX/h); h = MAX; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            res(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = rej;
          img.src = ev.target.result;
        };
        reader.onerror = rej;
        reader.readAsDataURL(newAvatarFile);
      });
      finalAvatarUrl    = base64;
      finalAvatarPreset = null;
    } catch(e) {
      showEditMsg('Error al procesar la imagen. Intentá de nuevo.','error');
      btn.disabled=false; btn.classList.remove('loading'); return;
    }
  } else if(selectedPreset){
    finalAvatarPreset = selectedPreset;
    finalAvatarUrl    = null;
  }

  const newUsername = document.getElementById('edit-username').value.trim().toLowerCase() || null;
  const changesLeft = currentProfile.username_changes_left ?? 3;

  // Si cambió el username, verificar que tiene cambios disponibles y descontar
  const usernameChanged = newUsername && newUsername !== currentProfile.username;
  if(usernameChanged && changesLeft <= 0){
    showEditMsg('Identidad sellada. Ya no podés cambiar tu ID.','error');
    btn.disabled=false; btn.classList.remove('loading'); return;
  }

  const payload = {
    display_name:  document.getElementById('edit-name').value.trim() || null,
    username:      newUsername,
    bio:           document.getElementById('edit-bio').value.trim() || null,
    avatar_url:    finalAvatarUrl,
    avatar_preset: finalAvatarPreset,
    updated_at:    new Date().toISOString()
  };

  // Descontar cambio solo si modificó el username
  if(usernameChanged && changesLeft < 99){
    payload.username_changes_left = Math.max(0, changesLeft - 1);
  }

  const { data: updated, error: saveErr } = await sb.from('profiles')
    .update(payload)
    .eq('id', currentUser.id)
    .select()
    .single();

  btn.disabled=false; btn.classList.remove('loading');

  if(!saveErr && updated){
    currentProfile = updated;
    closeEditModal();
    renderProfile();
    const msg = usernameChanged
      ? `Identidad actualizada — @${updated.username} · ${updated.username_changes_left >= 99 ? '∞' : updated.username_changes_left} cambio${updated.username_changes_left!==1?'s':''} restante${updated.username_changes_left!==1?'s':''}`
      : 'Perfil actualizado ✓';
    showToast(msg);
  } else {
    if(saveErr?.code === '23505'){
      showEditMsg('Ese ID ya está en uso. Elegí otro.','error');
    } else {
      showEditMsg('Error al guardar. Intentá de nuevo.','error');
      console.error('saveProfile error:', saveErr);
    }
  }
}

function showEditMsg(text, type){
  const el = document.getElementById('edit-msg');
  el.textContent = text;
  el.className = 'edit-msg '+type+' show';
}

// ══════════════════════════════════════════════
// LISTENERS DEL MODAL
// ══════════════════════════════════════════════
document.getElementById('edit-close').addEventListener('click', closeEditModal);
document.getElementById('edit-backdrop').addEventListener('click', closeEditModal);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeEditModal(); });

// ══════════════════════════════════════════════
// INIT — Soporta perfil propio Y perfiles ajenos
// URL sin params   → mi perfil (requiere sesión)
// ?u=username      → perfil público por username
// ?id=uuid         → perfil público por UUID
// ══════════════════════════════════════════════

function showNoSession(){
  document.getElementById('profile-root').innerHTML = `
    <div class="state-screen">
      <div class="state-title">Acceso restringido</div>
      <div class="state-sub">Necesitás iniciar sesión para ver tu perfil</div>
      <br>
      <a href="index.html" style="font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--white);letter-spacing:0.2em;text-decoration:none;text-transform:uppercase;border:1px solid var(--border-strong);padding:12px 28px;margin-top:8px;display:inline-block;">← Volver al inicio</a>
    </div>`;
}

function showNotFound(){
  document.getElementById('profile-root').innerHTML = `
    <div class="state-screen">
      <div class="state-title">Perfil no encontrado</div>
      <div class="state-sub">Este agente no existe en el archivo</div>
      <br>
      <a href="index.html" style="font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--white);letter-spacing:0.2em;text-decoration:none;text-transform:uppercase;border:1px solid var(--border-strong);padding:12px 28px;margin-top:8px;display:inline-block;">← Volver al inicio</a>
    </div>`;
}

async function loadPublicProfile(queryType, queryValue){
  const { data, error } = await sb.from('profiles')
    .select('*')
    .eq(queryType, queryValue)
    .maybeSingle();
  if(error) console.error('loadPublicProfile error:', error);
  if(!data){ showNotFound(); return; }
  currentProfile = data;
  renderProfile();
}

let _profileLoaded = false;

// Safety net — si tras 5s no cargó nada, mostrar error útil en lugar de spinner infinito
setTimeout(() => {
  if(!_profileLoaded){
    const root = document.getElementById('profile-root');
    if(root && root.querySelector('.loader-ring')){
      root.innerHTML = `
        <div class="state-screen">
          <div class="state-title">Tiempo agotado</div>
          <div class="state-sub">No se pudo recuperar la sesión. Cerrá sesión, volvé a ingresar e intentá de nuevo.</div>
          <br>
          <a href="index.html" style="font-family:'DM Mono',monospace;font-size:0.46rem;color:var(--white);letter-spacing:0.2em;text-decoration:none;text-transform:uppercase;border:1px solid var(--border-strong);padding:12px 28px;margin-top:8px;display:inline-block;">← Volver al inicio</a>
        </div>`;
    }
  }
}, 5000);

// ── Leer parámetros de URL ──
const _urlParams  = new URLSearchParams(window.location.search);
const _paramUser  = _urlParams.get('u');
const _paramId    = _urlParams.get('id');

if(_paramUser || _paramId){
  // Modo público: no requiere sesión
  _profileLoaded = true;
  if(_paramUser) loadPublicProfile('username', _paramUser.toLowerCase());
  else           loadPublicProfile('id', _paramId);
} else {
  // Modo privado: mi propio perfil
  // Con flowType:'implicit' la sesión está en localStorage y se lee al instante
  (async function init(){

    // Intento 1: getSession inmediato (lee localStorage sin red)
    const { data: d1 } = await sb.auth.getSession();
    if(d1?.session?.user){
      _profileLoaded = true;
      await loadProfile(d1.session.user);
      return;
    }

    // Intento 2: onAuthStateChange como fallback (por si el token estaba expirando)
    let resolved = false;
    sb.auth.onAuthStateChange(async (event, session) => {
      if(resolved || _profileLoaded) return;
      if(session?.user){
        resolved = true;
        _profileLoaded = true;
        await loadProfile(session.user);
      }
    });

    // Esperar máximo 3s a que onAuthStateChange resuelva
    await new Promise(r => setTimeout(r, 3000));
    if(!_profileLoaded) showNoSession();

  })();
}
</script>
